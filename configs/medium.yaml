# MEDIUM DIFFICULTY PRESET
# Characteristics:
# - Moderate conveyor velocity
# - Multiple packages moving across the belt
# - Barcode scale and aspect variations
# - Moderate rotation and 3D perspective distortion
# - Moderate motion blur and lighting variations
# - Occasional occlusions

simulation:
  seed: 42
  duration_seconds: 12.0
  fps: 30

output:
  output_dir: "outputs"
  save_frames: true
  save_video: true
  save_annotations: true
  save_coco: true
  save_yolo: true
  save_debug: true
  video_codec: "h264"
  video_crf: 18

camera:
  width: 1280
  height: 720
  zoom: 1.0
  position_x: 0.5
  position_y: 0.5

conveyor:
  direction: "left_to_right"
  speed_min: 130.0
  speed_max: 190.0
  speed_distribution: "uniform"
  acceleration: 0.0
  jitter_stddev: 0.8
  belt_color: [45, 45, 48]
  lane_y_ratio: 0.5
  lane_height_ratio: 0.7

packages:
  count: 18
  spawn_interval_min: 0.6
  spawn_interval_max: 1.4
  size:
    min_width: 130
    max_width: 250
    min_height: 90
    max_height: 190
  materials:
    cardboard: 0.45
    white_carton: 0.30
    colored_carton: 0.15
    poly_mailer: 0.10
  add_shipping_labels: true
  add_text_markings: true
  tape_probability: 0.7

barcodes:
  types:
    CODE128: 0.55
    EAN13: 0.35
    QRCODE: 0.10
  human_readable_text: true
  scale_min: 0.55
  scale_max: 0.90
  rotation_min: -15.0
  rotation_max: 15.0
  margin_padding: 6
  allow_partial_clip: false

effects:
  rotation:
    enabled: true
    min_degrees: -18.0
    max_degrees: 18.0
  perspective:
    enabled: true
    strength_min: 0.02
    strength_max: 0.10
    tilt_x_max: 10.0
    tilt_y_max: 10.0
  motion_blur:
    enabled: true
    factor: 0.035
    min_kernel: 1
    max_kernel: 9
  gaussian_blur:
    enabled: false
    min_sigma: 0.5
    max_sigma: 1.5
  brightness:
    enabled: true
    min_factor: 0.85
    max_factor: 1.15
  contrast:
    enabled: true
    min_factor: 0.85
    max_factor: 1.15
  gamma:
    enabled: true
    min_gamma: 0.90
    max_gamma: 1.10
  noise:
    enabled: true
    stddev_min: 1.0
    stddev_max: 4.0
  jpeg_compression:
    enabled: false
    min_quality: 75
    max_quality: 95
  glare:
    enabled: true
    probability: 0.20
    intensity_min: 0.2
    intensity_max: 0.6
    radius_min: 30
    radius_max: 90
  shadows:
    enabled: true
    probability: 0.25
    darkness_min: 0.2
    darkness_max: 0.45
  occlusion:
    enabled: true
    probability: 0.15
    max_occlusion_ratio: 0.35

renderer: "2d"
