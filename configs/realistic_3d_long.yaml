# REALISTIC 3D CONVEYOR WITH LONG GENERATION STREAM
# - 3D volumetric cuboid rendering with top, front, and side faces
# - 3D metallic conveyor rollers, side rails with hazard stripes
# - High frame count (1200+ frames) for comprehensive computer vision dataset capture
# - Diverse package stream with Code 128, EAN-13, and QR codes

simulation:
  seed: 100
  duration_seconds: 40.0
  fps: 30

output:
  output_dir: "outputs"
  save_frames: true
  save_video: true
  save_annotations: true
  save_coco: true
  save_yolo: true
  save_debug: true
  video_codec: "h264"
  video_crf: 18

camera:
  width: 1280
  height: 720
  zoom: 1.0
  position_x: 0.5
  position_y: 0.5
  elevation_angle_deg: 65.0
  enable_3d_cuboid: true

conveyor:
  direction: "left_to_right"
  speed_min: 120.0
  speed_max: 180.0
  speed_distribution: "uniform"
  acceleration: 0.0
  jitter_stddev: 0.6
  belt_color: [42, 42, 45]
  lane_y_ratio: 0.5
  lane_height_ratio: 0.68

packages:
  count: 35
  spawn_interval_min: 0.8
  spawn_interval_max: 1.6
  size:
    min_width: 160
    max_width: 290
    min_height: 110
    max_height: 200
  height_3d_ratio_min: 0.35
  height_3d_ratio_max: 0.70
  materials:
    cardboard: 0.45
    white_carton: 0.25
    colored_carton: 0.20
    poly_mailer: 0.10
  add_shipping_labels: true
  add_text_markings: true
  tape_probability: 0.75

barcodes:
  types:
    CODE128: 0.50
    EAN13: 0.35
    QRCODE: 0.15
  human_readable_text: true
  scale_min: 0.60
  scale_max: 0.90
  rotation_min: -15.0
  rotation_max: 15.0
  margin_padding: 6
  allow_partial_clip: false

effects:
  rotation:
    enabled: true
    min_degrees: -15.0
    max_degrees: 15.0
  perspective:
    enabled: true
    strength_min: 0.02
    strength_max: 0.12
    tilt_x_max: 10.0
    tilt_y_max: 10.0
  motion_blur:
    enabled: true
    factor: 0.035
    min_kernel: 1
    max_kernel: 8
  gaussian_blur:
    enabled: false
    min_sigma: 0.5
    max_sigma: 1.2
  brightness:
    enabled: true
    min_factor: 0.88
    max_factor: 1.12
  contrast:
    enabled: true
    min_factor: 0.88
    max_factor: 1.12
  gamma:
    enabled: false
    min_gamma: 0.90
    max_gamma: 1.10
  noise:
    enabled: true
    stddev_min: 1.0
    stddev_max: 3.5
  jpeg_compression:
    enabled: false
    min_quality: 75
    max_quality: 95
  glare:
    enabled: true
    probability: 0.18
    intensity_min: 0.2
    intensity_max: 0.55
    radius_min: 30
    radius_max: 80
  shadows:
    enabled: true
    probability: 0.25
    darkness_min: 0.2
    darkness_max: 0.4
  occlusion:
    enabled: true
    probability: 0.15
    max_occlusion_ratio: 0.35

renderer: "2d"
