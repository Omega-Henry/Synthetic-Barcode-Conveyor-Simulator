# REALISTIC 3D CONVEYOR WITH LONG GENERATION STREAM (CRISP & SHARP)
# - High-clarity 3D volumetric cuboid rendering with top, front, and side faces
# - Large, high-contrast QR codes and 1D barcodes for effortless readability & detection
# - 3D metallic conveyor rollers, side rails with hazard stripes
# - Visually lossless H.264 encoding with razor-sharp edges

simulation:
  seed: 100
  duration_seconds: 20.0
  fps: 30

output:
  output_dir: "outputs"
  save_frames: true
  save_video: true
  save_annotations: true
  save_coco: true
  save_yolo: true
  save_debug: true
  video_codec: "h264"
  video_crf: 14

camera:
  width: 1280
  height: 720
  zoom: 1.0
  position_x: 0.5
  position_y: 0.5
  elevation_angle_deg: 65.0
  enable_3d_cuboid: true

conveyor:
  direction: "left_to_right"
  speed_min: 100.0
  speed_max: 150.0
  speed_distribution: "uniform"
  acceleration: 0.0
  jitter_stddev: 0.2
  belt_color: [42, 42, 45]
  lane_y_ratio: 0.5
  lane_height_ratio: 0.68

packages:
  count: 20
  spawn_interval_min: 0.9
  spawn_interval_max: 1.6
  size:
    min_width: 200
    max_width: 320
    min_height: 140
    max_height: 230
  height_3d_ratio_min: 0.35
  height_3d_ratio_max: 0.65
  materials:
    cardboard: 0.45
    white_carton: 0.30
    colored_carton: 0.15
    poly_mailer: 0.10
  add_shipping_labels: true
  add_text_markings: true
  tape_probability: 0.70

barcodes:
  types:
    CODE128: 0.40
    EAN13: 0.30
    QRCODE: 0.30
  human_readable_text: true
  scale_min: 0.85
  scale_max: 1.10
  rotation_min: -8.0
  rotation_max: 8.0
  margin_padding: 8
  allow_partial_clip: false

effects:
  rotation:
    enabled: true
    min_degrees: -10.0
    max_degrees: 10.0
  perspective:
    enabled: true
    strength_min: 0.01
    strength_max: 0.06
    tilt_x_max: 6.0
    tilt_y_max: 6.0
  motion_blur:
    enabled: false
    factor: 0.005
    min_kernel: 1
    max_kernel: 2
  gaussian_blur:
    enabled: false
    min_sigma: 0.5
    max_sigma: 1.0
  brightness:
    enabled: true
    min_factor: 0.95
    max_factor: 1.05
  contrast:
    enabled: true
    min_factor: 0.95
    max_factor: 1.05
  gamma:
    enabled: false
    min_gamma: 0.95
    max_gamma: 1.05
  noise:
    enabled: false
    stddev_min: 0.0
    stddev_max: 0.0
  jpeg_compression:
    enabled: false
    min_quality: 90
    max_quality: 98
  glare:
    enabled: false
    probability: 0.0
    intensity_min: 0.1
    intensity_max: 0.3
    radius_min: 20
    radius_max: 50
  shadows:
    enabled: true
    probability: 0.20
    darkness_min: 0.15
    darkness_max: 0.30
  occlusion:
    enabled: true
    probability: 0.10
    max_occlusion_ratio: 0.25

renderer: "2d"
