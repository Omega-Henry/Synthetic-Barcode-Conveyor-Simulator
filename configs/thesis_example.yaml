# THESIS EXPERIMENT PRESET
# Baseline configuration for systematic parameter sweeps (e.g. speed vs accuracy, tilt vs IoU).

simulation:
  seed: 42
  duration_seconds: 10.0
  fps: 30

output:
  output_dir: "outputs/thesis_experiments"
  save_frames: true
  save_video: true
  save_annotations: true
  save_coco: true
  save_yolo: true
  save_debug: true
  video_codec: "h264"
  video_crf: 18

camera:
  width: 1280
  height: 720
  zoom: 1.0
  position_x: 0.5
  position_y: 0.5

conveyor:
  direction: "left_to_right"
  speed_min: 150.0
  speed_max: 150.0
  speed_distribution: "constant"
  acceleration: 0.0
  jitter_stddev: 0.0
  belt_color: [45, 45, 48]
  lane_y_ratio: 0.5
  lane_height_ratio: 0.7

packages:
  count: 15
  spawn_interval_min: 0.8
  spawn_interval_max: 0.8
  size:
    min_width: 160
    max_width: 240
    min_height: 110
    max_height: 180
  materials:
    cardboard: 0.50
    white_carton: 0.30
    colored_carton: 0.20
  add_shipping_labels: true
  add_text_markings: true
  tape_probability: 0.7

barcodes:
  types:
    CODE128: 0.60
    EAN13: 0.40
  human_readable_text: true
  scale_min: 0.7
  scale_max: 0.7
  rotation_min: 0.0
  rotation_max: 0.0
  margin_padding: 6
  allow_partial_clip: false

effects:
  rotation:
    enabled: true
    min_degrees: -10.0
    max_degrees: 10.0
  perspective:
    enabled: true
    strength_min: 0.05
    strength_max: 0.05
    tilt_x_max: 8.0
    tilt_y_max: 8.0
  motion_blur:
    enabled: true
    factor: 0.03
    min_kernel: 1
    max_kernel: 10
  gaussian_blur:
    enabled: false
    min_sigma: 0.5
    max_sigma: 1.0
  brightness:
    enabled: true
    min_factor: 0.90
    max_factor: 1.10
  contrast:
    enabled: true
    min_factor: 0.90
    max_factor: 1.10
  gamma:
    enabled: false
    min_gamma: 0.90
    max_gamma: 1.10
  noise:
    enabled: true
    stddev_min: 1.0
    stddev_max: 3.0
  jpeg_compression:
    enabled: false
    min_quality: 85
    max_quality: 95
  glare:
    enabled: false
    probability: 0.1
    intensity_min: 0.2
    intensity_max: 0.5
    radius_min: 30
    radius_max: 80
  shadows:
    enabled: true
    probability: 0.2
    darkness_min: 0.2
    darkness_max: 0.4
  occlusion:
    enabled: false
    probability: 0.0
    max_occlusion_ratio: 0.0

renderer: "2d"
