[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barcode-conveyor-simulator"
version = "0.1.0"
description = "Synthetic Industrial Barcode Conveyor-Belt Video Generation System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Antigravity Simulation Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "python-barcode>=0.15.0",
    "qrcode>=7.4.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "zxing-cpp>=2.2.0",
    "pyzbar>=0.1.9",
]

[project.scripts]
barcode-simulator = "barcode_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
